name: Bug report
description: A wrong score, a failed probe, or a crash
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the target only if it is yours or public, and the scan result or error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong score, say how you verified the server's real configuration (e.g. `openssl s_client -groups X25519MLKEM768`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or image tag
