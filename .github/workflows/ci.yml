name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sec-scan:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 sec-scan:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/metodologi | grep -q "nilai rujukan"
          curl -fsS http://127.0.0.1:8000/static/app.css > /dev/null
          curl -fsS http://127.0.0.1:8000/static/fonts/atkinson-next.woff2 > /dev/null
          curl -fsS http://127.0.0.1:8000/static/contoh/miraestudio-id.pdf | head -c 5 | grep -q "%PDF"
