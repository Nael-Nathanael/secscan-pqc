services:
  app:
    build: .
    image: sec-scan:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # Hard limits so a burst of scans cannot starve the host.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
